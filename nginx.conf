# nginx.conf for frontend container
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Do not serve hidden files
    location ~ /\. {
        deny all;
    }

    # Serve index.html with no cache (so clients get latest HTML & asset refs)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # Long caching for hashed assets (js, css, fonts, images)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|eot|ttf|otf)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
    }

    # Short caching for manifests and maps
    location ~* \.(?:xml|txt|map|webmanifest|json)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    # SPA fallback: if resource not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
